<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 即時競標搶購系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h2 {
            color: #3a7bd5;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3a7bd5;
        }

        button {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .status.success {
            background: #4caf50;
            color: white;
        }

        .status.error {
            background: #f44336;
            color: white;
        }

        .status.info {
            background: #2196f3;
            color: white;
        }

        .status.warning {
            background: #ff9800;
            color: white;
        }

        .leaderboard {
            margin-top: 20px;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .ws-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .ws-status.connected {
            background: #4caf50;
            color: white;
        }

        .ws-status.disconnected {
            background: #f44336;
            color: white;
        }

        .ws-status::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3a7bd5;
        }

        .rank.winner {
            color: #ffd700;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.winner {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
        }

        .badge.loser {
            background: #e0e0e0;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2rem;
            }
        }

        .user-info {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .user-info h3 {
            margin-bottom: 10px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .bid-result {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 600;
        }

        .bid-result.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .bid-result.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .stat-box {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-top: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3a7bd5;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3a7bd5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ 即時競標搶購系統</h1>
            <p>Real-time Bidding & Flash Sale System</p>
        </header>

        <div class="grid">
            <!-- 左側：用戶操作 -->
            <div>
                <!-- 登入區 -->
                <div class="card">
                    <h2>🔐 用戶登入</h2>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="user@example.com">
                    </div>
                    <div class="input-group">
                        <label for="password">密碼</label>
                        <input type="password" id="password" placeholder="password123">
                    </div>
                    <button onclick="register()">註冊</button>
                    <button onclick="login()">登入</button>
                    <div id="authStatus"></div>
                </div>

                <!-- 用戶資訊 -->
                <div class="card" id="userInfoCard" style="display: none;">
                    <h2>👤 用戶資訊</h2>
                    <div class="user-info">
                        <h3 id="userEmail"></h3>
                        <p>User ID: <strong id="userId"></strong></p>
                        <p>會員權重 (W): <strong id="userWeight"></strong></p>
                    </div>
                </div>

                <!-- 出價區 -->
                <div class="card" id="bidCard" style="display: none;">
                    <h2>💰 提交出價</h2>
                    <div class="input-group">
                        <label for="saleId">選擇活動</label>
                        <select id="saleId" onchange="loadSaleInfo()">
                            <option value="">載入中...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="bidPrice">出價金額</label>
                        <input type="number" id="bidPrice" placeholder="1500" step="100">
                    </div>
                    <button onclick="submitBid()" id="bidButton">🚀 立即出價</button>
                    <div id="bidResult"></div>
                </div>
            </div>

            <!-- 右側：即時排行榜 -->
            <div>
                <div class="card">
                    <div class="leaderboard-header">
                        <h2>🏆 即時排行榜</h2>
                        <div class="ws-status disconnected" id="wsStatus">
                            未連接
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="leaderboardSaleId">選擇商品</label>
                        <select id="leaderboardSaleId" onchange="changeLeaderboardSale()">
                            <option value="">載入中...</option>
                        </select>
                    </div>

                    <div class="stat-box">
                        <div class="stat-item">
                            <div class="stat-value" id="totalBids">0</div>
                            <div class="stat-label">總出價數</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="inventoryLimit">0</div>
                            <div class="stat-label">得標名額</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="highestPrice">0</div>
                            <div class="stat-label">最高出價</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="minWinningScore">0.00</div>
                            <div class="stat-label">最低得標門檻分數</div>
                        </div>
                    </div>

                    <button onclick="connectWebSocket()" id="wsConnectBtn">連接 WebSocket</button>
                    <button onclick="disconnectWebSocket()" id="wsDisconnectBtn" style="display: none;">斷開連接</button>

                    <div class="leaderboard">
                        <table>
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>用戶 ID</th>
                                    <th>出價</th>
                                    <th>分數</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: #999;">
                                        等待資料...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
